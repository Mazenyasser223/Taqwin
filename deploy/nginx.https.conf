# Production HTTPS — mount via NGINX_CONF_FILE=./nginx.https.conf in deploy/.env
# Requires Let's Encrypt certs on the host at /etc/letsencrypt/live/taqwin.online/

upstream taqwin_api {
    server api:4000;
    keepalive 16;
}

# --- HTTP: ACME + redirect to HTTPS ---
server {
    listen 80;
    server_name taqwin.online www.taqwin.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name api.taqwin.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: SPA ---
server {
    listen 443 ssl http2;
    server_name taqwin.online www.taqwin.online;

    ssl_certificate     /etc/letsencrypt/live/taqwin.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taqwin.online/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- HTTPS: API + WebSocket ---
server {
    listen 443 ssl http2;
    server_name api.taqwin.online;

    ssl_certificate     /etc/letsencrypt/live/taqwin.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taqwin.online/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/internal/ {
        deny all;
        return 403;
    }

    location /ws {
        proxy_pass http://taqwin_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://taqwin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;
    }
}
