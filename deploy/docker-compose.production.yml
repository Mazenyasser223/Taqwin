# Taqwin — production stack for Hostinger VPS (KVM 2).
# Usage:
#   cp .env.production.example .env   # fill secrets on VPS
#   cd .. && cd frontend && npm ci && VITE_API_URL=https://api.taqwin.online npm run build
#   cd ../deploy
#   docker compose -f docker-compose.production.yml --env-file .env up -d --build
#
# Legacy Render API: set VITE_API_URL=https://taqwin.onrender.com when building frontend.

name: taqwin

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ${NGINX_CONF_FILE:-./nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - taqwin

  api:
    build:
      context: ../backend-node
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '4000'
      FEATURE_AI_VIA_FASTAPI: ${FEATURE_AI_VIA_FASTAPI:-true}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8000}
      FEATURE_PLAN_QUEUE: ${FEATURE_PLAN_QUEUE:-true}
      RAG_PREFER_PGVECTOR: ${RAG_PREFER_PGVECTOR:-true}
    volumes:
      - ../shared:/shared:ro
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - taqwin

  ai:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_INTERNAL_API_URL: http://api:4000
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ../shared:/shared:ro
    expose:
      - '8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - taqwin
    depends_on:
      api:
        condition: service_started

  worker:
    build:
      context: ../backend-node
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WORKER_MODE: '1'
      FEATURE_PLAN_QUEUE: ${FEATURE_PLAN_QUEUE:-true}
    volumes:
      - ../shared:/shared:ro
    command: ['node', 'src/worker.js']
    depends_on:
      api:
        condition: service_healthy
    networks:
      - taqwin

networks:
  taqwin:
    driver: bridge
