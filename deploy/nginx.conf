# Active nginx config for Docker Compose (HTTP). For HTTPS, see nginx.conf.example.

upstream taqwin_api {
    server api:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name taqwin.com www.taqwin.com localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.taqwin.com localhost;

    location / {
        proxy_pass http://taqwin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }
}
