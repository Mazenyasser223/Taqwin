# Active nginx config for Docker Compose (HTTP). For HTTPS, see nginx.https.conf.

upstream taqwin_api {
    server api:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name taqwin.online www.taqwin.online localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.taqwin.online localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Block public access to Node internal API (FastAPI uses Docker http://api:4000).
    location /api/internal/ {
        deny all;
        return 403;
    }

    location /ws {
        proxy_pass http://taqwin_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://taqwin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;
    }
}
